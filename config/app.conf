# Smart City Complaint System - runtime configuration
# The application reads this file at start-up (backend/Config.cpp).
DB_HOST=localhost
DB_PORT=5433
DB_NAME=scms
DB_USER=scms_app
DB_PASSWORD=scms_app_pw
MAP_FILE=opengl/data/india.map
FONT_REGULAR=C:/Windows/Fonts/segoeui.ttf
FONT_SEMIBOLD=C:/Windows/Fonts/seguisb.ttf
FONT_BOLD=C:/Windows/Fonts/segoeuib.ttf
EXPORT_DIR=exports

# ---- AI assistant (Groq) - OPTIONAL ---------------------------------------------------------------------------
# Put the API key in the project-root .env file (see .env.example). Keep .env private.
# Legacy GROQ_API_KEY values in this file are still supported.
GROQ_MODEL=openai/gpt-oss-20b
# 1 = direct AI (every message goes to Groq, any topic)    0 = built-in assistant first, Groq only for what it cannot answer
GROQ_MODE=1
# 1 = the AI may see the category / status / location / description of the complaint being discussed, 0 = never
GROQ_SHARE_DETAILS=1
